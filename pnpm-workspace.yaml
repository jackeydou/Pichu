packages:
  - apps/*
  - packages/*

allowBuilds:
  '@google/genai': false
  better-sqlite3: true
  crc64-ecma182.js: false
  electron: true
  electron-winstaller: false
  esbuild: false
  koffi: false
  msw: false
  node-pty: true
  protobufjs: false
  sharp: false
  tos-crc64-js: false

ignoredBuiltDependencies:
  - '@biomejs/biome'
  - esbuild

onlyBuiltDependencies:
